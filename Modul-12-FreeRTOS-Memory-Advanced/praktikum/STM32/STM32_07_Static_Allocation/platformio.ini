; PlatformIO Configuration File
; Modul 12 - Program 07: Static Allocation
; Target: STM32F103C8T6 (Blue Pill)

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino

; FreeRTOS Library
lib_deps = 
    stm32duino/STM32FreeRTOS@^10.3.2

; Serial Monitor
monitor_speed = 115200

; Build flags for static allocation
build_flags = 
    -D SERIAL_UART_INSTANCE=1
    -D configSUPPORT_STATIC_ALLOCATION=1
    -D configSUPPORT_DYNAMIC_ALLOCATION=0
    -D configTOTAL_HEAP_SIZE=0

; Upload settings
upload_protocol = stlink
