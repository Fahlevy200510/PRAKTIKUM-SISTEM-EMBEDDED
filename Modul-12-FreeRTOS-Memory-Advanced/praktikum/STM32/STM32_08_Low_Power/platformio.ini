; PlatformIO Configuration File
; Modul 12 - Program 08: Low Power Tickless Idle
; Target: STM32F103C8T6 (Blue Pill)

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino

; FreeRTOS Library
lib_deps = 
    stm32duino/STM32FreeRTOS@^10.3.2

; Serial Monitor
monitor_speed = 115200

; Build flags for low power
build_flags = 
    -D SERIAL_UART_INSTANCE=1
    -D configUSE_TICKLESS_IDLE=1
    -D configEXPECTED_IDLE_TIME_BEFORE_SLEEP=5
    -D configPRE_SLEEP_PROCESSING(x)=vPreSleepProcessing(x)
    -D configPOST_SLEEP_PROCESSING(x)=vPostSleepProcessing(x)

; Upload settings
upload_protocol = stlink
