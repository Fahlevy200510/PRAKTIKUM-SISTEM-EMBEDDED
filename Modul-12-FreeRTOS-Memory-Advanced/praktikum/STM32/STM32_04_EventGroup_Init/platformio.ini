; PlatformIO Project Configuration File - STM32 Event Groups
; Modul 12 - Program 04: Event Groups System Initialization
; Board: STM32F103C8T6 (Blue Pill)

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
debug_tool = stlink

build_flags = 
    -D LED_BUILTIN=PC13
    -D configCHECK_FOR_STACK_OVERFLOW=2

lib_deps = 
    stm32duino/STM32FreeRTOS@^10.3.1
