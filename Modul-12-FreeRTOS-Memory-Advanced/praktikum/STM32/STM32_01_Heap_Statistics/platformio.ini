; PlatformIO Project Configuration File - STM32 Heap Statistics Monitor
; Modul 12 - Program 01: Heap Statistics Monitoring
; Board: STM32F103C8T6 (Blue Pill)

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
debug_tool = stlink

build_flags = 
    -D LED_BUILTIN=PC13
    -D configUSE_TRACE_FACILITY=1
    -D configGENERATE_RUN_TIME_STATS=1
    -D configUSE_STATS_FORMATTING_FUNCTIONS=1
    -D configCHECK_FOR_STACK_OVERFLOW=2

lib_deps = 
    stm32duino/STM32FreeRTOS@^10.3.1
