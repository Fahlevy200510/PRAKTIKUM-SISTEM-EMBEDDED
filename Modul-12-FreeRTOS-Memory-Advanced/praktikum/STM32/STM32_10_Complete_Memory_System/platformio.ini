; PlatformIO Configuration File
; Modul 12 - Program 10: Complete Memory Management System
; Target: STM32F103C8T6 (Blue Pill)

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino

; FreeRTOS Library
lib_deps = 
    stm32duino/STM32FreeRTOS@^10.3.2

; Serial Monitor
monitor_speed = 115200

; Build flags - comprehensive memory features
build_flags = 
    -D SERIAL_UART_INSTANCE=1
    -D configTOTAL_HEAP_SIZE=15360
    -D configCHECK_FOR_STACK_OVERFLOW=2
    -D configUSE_MALLOC_FAILED_HOOK=1
    -D configRECORD_STACK_HIGH_WATER_MARK=1
    -D configSUPPORT_STATIC_ALLOCATION=1
    -D configSUPPORT_DYNAMIC_ALLOCATION=1

; Upload settings
upload_protocol = stlink
