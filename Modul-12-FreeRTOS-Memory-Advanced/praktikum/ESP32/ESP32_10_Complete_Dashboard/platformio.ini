; PlatformIO Configuration File
; Modul 12 - ESP32 Program 10: Complete Memory Dashboard
; Target: ESP32 DevKit V1

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor
monitor_speed = 115200

build_flags = 
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
