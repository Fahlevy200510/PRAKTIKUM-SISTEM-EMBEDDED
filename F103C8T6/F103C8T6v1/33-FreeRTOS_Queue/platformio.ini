[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube

; Build flags for FreeRTOS
build_flags = 
    -D USE_HAL_DRIVER
    -D STM32F103xB
    -I lib/FreeRTOS/include
    -I lib/FreeRTOS/portable/GCC/ARM_CM3
    -O2

; Library dependencies
lib_deps = 
    FreeRTOS-Kernel@^10.5.1

; Upload protocol
upload_protocol = stlink
debug_tool = stlink

; Serial monitor settings
monitor_speed = 115200
