; PlatformIO Project Configuration File
; STM32F103C8T6 - Cooperative Multitasking
; Praktikum 10: Simple Multitasking without RTOS

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube

upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

build_flags = 
    -D USE_HAL_DRIVER
    -D STM32F103xB
